<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MosquitoMo</title>
  <meta name="description" content="Mosquito and malaria risk for where you are in Uganda, with what to do about it.">
  <meta name="theme-color" content="#1B2340">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#here" aria-label="MosquitoMo home">
      <img src="icons/mark.svg" alt="" width="28" height="28">

  <nav class="tabs" aria-label="Main">
    <a href="#here" data-tab="here"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Here</a>

    <a href="#map" data-tab="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-6-2-6 2v16l6-2 6 2 6-2V3zm0 13.8-6-2V5.2l6 2z"/></svg>Map</a>
    <a href="#report" data-tab="report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-3 4-6 7.5-6 11a6 6 0 0 0 12 0c0-3.5-3-7-6-11zm1 15h-2v-2h2zm0-4h-2V9h2z"/></svg>Report</a>
    <a href="#learn" data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zm16 0h-4a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h5z"/></svg>Learn</a>

  <script type="module" src="js/app.js"></script>

</html>
